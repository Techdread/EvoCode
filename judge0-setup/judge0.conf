# Judge0 Configuration File
# See: https://github.com/judge0/judge0/blob/master/judge0.conf.default

################################################################################
# Judge0 Configuration
################################################################################

# Disable authentication for local development
AUTHN_HEADER=
AUTHN_TOKEN=
AUTHZ_HEADER=
AUTHZ_TOKEN=

# Allow wait parameter for synchronous submissions
ENABLE_WAIT_RESULT=true

# Enable all languages
ENABLE_BATCHED_SUBMISSIONS=true

# Maximum submission batch size
MAX_SUBMISSION_BATCH_SIZE=20

################################################################################
# Worker Configuration
################################################################################

# Number of workers (adjust based on CPU cores)
RAILS_MAX_THREADS=4
RAILS_ENV=production
SECRET_KEY_BASE=your-secret-key-base-change-in-production

# Resource Limits
CPU_TIME_LIMIT=5
CPU_EXTRA_TIME=1
WALL_TIME_LIMIT=15
MEMORY_LIMIT=128000
STACK_LIMIT=64000
MAX_PROCESSES_AND_OR_THREADS=60
MAX_FILE_SIZE=1024

# Compilation limits
COMPILATION_CPU_TIME_LIMIT=15
COMPILATION_MEMORY_LIMIT=256000
COMPILATION_MAX_PROCESSES_AND_OR_THREADS=60
COMPILATION_MAX_FILE_SIZE=4096

################################################################################
# Network Configuration (Security)
################################################################################

# Disable network access in sandbox for security
ENABLE_NETWORK=false

################################################################################
# Database Configuration
################################################################################

POSTGRES_HOST=db
POSTGRES_PORT=5432
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=judge0password

################################################################################
# Redis Configuration
################################################################################

REDIS_HOST=redis
REDIS_PORT=6379
REDIS_PASSWORD=redispassword
