id: fizzbuzz_cpp
name: "FizzBuzz (C++)"
language: cpp
difficulty: easy
description: |
  Write a function fizzbuzz(int n) that returns a string based on the following rules:

  - If n is divisible by 3, return "Fizz"
  - If n is divisible by 5, return "Buzz"
  - If n is divisible by both 3 and 5, return "FizzBuzz"
  - Otherwise, return the number as a string

template: |
  #include <string>

  std::string fizzbuzz(int n) {
      // Your code here
  }

runner: |
  #include <iostream>
  #include <string>
  using namespace std;

  {{solution}}

  int main() {
      int n;
      cin >> n;
      cout << fizzbuzz(n) << endl;
      return 0;
  }

test_cases:
  - input: "1"
    expected: "1"
  - input: "3"
    expected: "Fizz"
  - input: "5"
    expected: "Buzz"
  - input: "15"
    expected: "FizzBuzz"

hidden_tests:
  - input: "2"
    expected: "2"
  - input: "6"
    expected: "Fizz"
  - input: "10"
    expected: "Buzz"
  - input: "30"
    expected: "FizzBuzz"
  - input: "9"
    expected: "Fizz"
  - input: "25"
    expected: "Buzz"
