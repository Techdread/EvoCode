id: fibonacci
name: "Fibonacci Number"
language: python
difficulty: easy
description: |
  Write a function fib(n) that returns the nth Fibonacci number.

  The Fibonacci sequence is defined as:
  - F(0) = 0
  - F(1) = 1
  - F(n) = F(n-1) + F(n-2) for n > 1

  Examples:
  - fib(0) = 0
  - fib(1) = 1
  - fib(2) = 1
  - fib(10) = 55

  Constraints: 0 <= n <= 40

template: |
  def fib(n: int) -> int:
      pass

runner: |
  {{solution}}
  n = int(input())
  print(fib(n))

test_cases:
  - input: "0"
    expected: "0"
  - input: "1"
    expected: "1"
  - input: "10"
    expected: "55"

hidden_tests:
  - input: "2"
    expected: "1"
  - input: "5"
    expected: "5"
  - input: "15"
    expected: "610"
  - input: "20"
    expected: "6765"
  - input: "30"
    expected: "832040"
  - input: "40"
    expected: "102334155"
