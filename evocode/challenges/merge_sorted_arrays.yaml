id: merge_sorted_arrays
name: "Merge Two Sorted Arrays"
language: python
difficulty: easy
description: |
  You are given two integer arrays nums1 and nums2, sorted in non-decreasing order.

  Merge nums2 into nums1 as one sorted array and return it as a space-separated string.

  Input format:
  - First line: space-separated integers (nums1)
  - Second line: space-separated integers (nums2)

  Example:
  - nums1 = [1,2,3], nums2 = [2,5,6]
  - Output: "1 2 2 3 5 6"

template: |
  def merge(nums1: list[int], nums2: list[int]) -> list[int]:
      pass

runner: |
  {{solution}}
  nums1 = list(map(int, input().split())) if input != "" else []
  nums2 = list(map(int, input().split())) if input != "" else []
  result = merge(nums1, nums2)
  print(" ".join(map(str, result)))

test_cases:
  - input: "1 2 3\n2 5 6"
    expected: "1 2 2 3 5 6"
  - input: "1\n"
    expected: "1"
  - input: "\n1"
    expected: "1"

hidden_tests:
  - input: "1 3 5 7\n2 4 6 8"
    expected: "1 2 3 4 5 6 7 8"
  - input: "1 1 1\n1 1 1"
    expected: "1 1 1 1 1 1"
  - input: "1 2 3\n4 5 6"
    expected: "1 2 3 4 5 6"
  - input: "4 5 6\n1 2 3"
    expected: "1 2 3 4 5 6"
