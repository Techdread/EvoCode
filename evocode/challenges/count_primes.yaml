id: count_primes
name: "Count Primes (Sieve of Eratosthenes)"
language: python
difficulty: medium
description: |
  Given an integer n, return the count of prime numbers that are strictly less than n.

  Use the Sieve of Eratosthenes for an efficient O(n log log n) solution.

  Examples:
  - n=10 → 4 (primes less than 10 are: 2, 3, 5, 7)
  - n=0 → 0
  - n=1 → 0

template: |
  def count_primes(n: int) -> int:
      pass

runner: |
  {{solution}}
  n = int(input())
  print(count_primes(n))

test_cases:
  - input: "10"
    expected: "4"
  - input: "0"
    expected: "0"
  - input: "1"
    expected: "0"

hidden_tests:
  - input: "2"
    expected: "0"
  - input: "3"
    expected: "1"
  - input: "20"
    expected: "8"
  - input: "100"
    expected: "25"
  - input: "1000"
    expected: "168"
