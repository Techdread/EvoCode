id: fizzbuzz_rust
name: "FizzBuzz (Rust)"
language: rust
difficulty: easy
description: |
  Write a function fizzbuzz(n: i32) that returns a String based on the following rules:

  - If n is divisible by 3, return "Fizz"
  - If n is divisible by 5, return "Buzz"
  - If n is divisible by both 3 and 5, return "FizzBuzz"
  - Otherwise, return the number as a string

template: |
  fn fizzbuzz(n: i32) -> String {
      // Your code here
  }

runner: |
  use std::io::{self, BufRead};

  {{solution}}

  fn main() {
      let stdin = io::stdin();
      let line = stdin.lock().lines().next().unwrap().unwrap();
      let n: i32 = line.trim().parse().unwrap();
      println!("{}", fizzbuzz(n));
  }

test_cases:
  - input: "1"
    expected: "1"
  - input: "3"
    expected: "Fizz"
  - input: "5"
    expected: "Buzz"
  - input: "15"
    expected: "FizzBuzz"

hidden_tests:
  - input: "2"
    expected: "2"
  - input: "6"
    expected: "Fizz"
  - input: "10"
    expected: "Buzz"
  - input: "30"
    expected: "FizzBuzz"
  - input: "9"
    expected: "Fizz"
  - input: "25"
    expected: "Buzz"
