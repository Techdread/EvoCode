id: fizzbuzz
name: "FizzBuzz"
language: python
difficulty: easy
description: |
  Write a function fizzbuzz(n) that returns a string based on the following rules:

  - If n is divisible by 3, return "Fizz"
  - If n is divisible by 5, return "Buzz"
  - If n is divisible by both 3 and 5, return "FizzBuzz"
  - Otherwise, return the number as a string

template: |
  def fizzbuzz(n: int) -> str:
      pass

runner: |
  {{solution}}
  n = int(input())
  print(fizzbuzz(n))

test_cases:
  - input: "1"
    expected: "1"
  - input: "3"
    expected: "Fizz"
  - input: "5"
    expected: "Buzz"
  - input: "15"
    expected: "FizzBuzz"

hidden_tests:
  - input: "2"
    expected: "2"
  - input: "6"
    expected: "Fizz"
  - input: "10"
    expected: "Buzz"
  - input: "30"
    expected: "FizzBuzz"
  - input: "9"
    expected: "Fizz"
  - input: "25"
    expected: "Buzz"
  - input: "45"
    expected: "FizzBuzz"
  - input: "97"
    expected: "97"
