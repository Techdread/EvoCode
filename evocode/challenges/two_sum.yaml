id: two_sum
name: "Two Sum"
language: python
difficulty: easy
description: |
  Given an array of integers and a target sum, return the indices of two numbers that add up to the target.

  You may assume that each input has exactly one solution, and you may not use the same element twice.

  Return the indices in any order, but as a comma-separated string (e.g., "0,1").

  Input format:
  - First line: space-separated integers (the array)
  - Second line: the target sum

  Example:
  - Input array: [2, 7, 11, 15], target: 9
  - Output: "0,1" (because nums[0] + nums[1] = 2 + 7 = 9)

template: |
  def two_sum(nums: list[int], target: int) -> str:
      pass

runner: |
  {{solution}}
  nums = list(map(int, input().split()))
  target = int(input())
  result = two_sum(nums, target)
  print(result)

test_cases:
  - input: "2 7 11 15\n9"
    expected: "0,1"
  - input: "3 2 4\n6"
    expected: "1,2"
  - input: "3 3\n6"
    expected: "0,1"

hidden_tests:
  - input: "1 2 3 4 5\n9"
    expected: "3,4"
  - input: "-1 -2 -3 -4 -5\n-8"
    expected: "2,4"
  - input: "0 4 3 0\n0"
    expected: "0,3"
  - input: "1 5 2 8 3\n10"
    expected: "1,3"
  - input: "100 200 300 400\n700"
    expected: "2,3"
