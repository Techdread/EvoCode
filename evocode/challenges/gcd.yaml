id: gcd
name: "Greatest Common Divisor"
language: python
difficulty: easy
description: |
  Write a function gcd(a, b) that returns the greatest common divisor of two positive integers.

  Use Euclid's algorithm for an efficient solution.

  Input: Two space-separated integers
  Output: Their GCD

  Examples:
  - gcd(12, 8) → 4
  - gcd(17, 5) → 1
  - gcd(100, 25) → 25

template: |
  def gcd(a: int, b: int) -> int:
      pass

runner: |
  {{solution}}
  a, b = map(int, input().split())
  print(gcd(a, b))

test_cases:
  - input: "12 8"
    expected: "4"
  - input: "17 5"
    expected: "1"
  - input: "100 25"
    expected: "25"

hidden_tests:
  - input: "1 1"
    expected: "1"
  - input: "7 7"
    expected: "7"
  - input: "48 18"
    expected: "6"
  - input: "1071 462"
    expected: "21"
  - input: "270 192"
    expected: "6"
  - input: "13 7"
    expected: "1"
