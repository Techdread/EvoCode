id: fizzbuzz_go
name: "FizzBuzz (Go)"
language: go
difficulty: easy
description: |
  Write a function fizzbuzz(n int) that returns a string based on the following rules:

  - If n is divisible by 3, return "Fizz"
  - If n is divisible by 5, return "Buzz"
  - If n is divisible by both 3 and 5, return "FizzBuzz"
  - Otherwise, return the number as a string

template: |
  func fizzbuzz(n int) string {
      // Your code here
  }

runner: |
  package main

  import (
      "fmt"
      "strconv"
  )

  {{solution}}

  func main() {
      var n int
      fmt.Scan(&n)
      fmt.Println(fizzbuzz(n))
  }

  // Helper for converting int to string (available to solution)
  var _ = strconv.Itoa

test_cases:
  - input: "1"
    expected: "1"
  - input: "3"
    expected: "Fizz"
  - input: "5"
    expected: "Buzz"
  - input: "15"
    expected: "FizzBuzz"

hidden_tests:
  - input: "2"
    expected: "2"
  - input: "6"
    expected: "Fizz"
  - input: "10"
    expected: "Buzz"
  - input: "30"
    expected: "FizzBuzz"
  - input: "9"
    expected: "Fizz"
  - input: "25"
    expected: "Buzz"
